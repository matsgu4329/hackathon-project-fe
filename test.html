```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git 테스트 페이지</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f5f5f5;
        }

        .box {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>테스트 페이지</h1>
        <p>GitHub 연동 테스트 중입니다.</p>

        <button onclick="showMessage()">
            클릭해보기
        </button>

        <p id="result"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("result").innerText =
                "정상적으로 JavaScript가 실행되었습니다!";
        }
    </script>
</body>
</html>
```
